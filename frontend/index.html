<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TP DevOps - Tasks</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    li { padding: 6px 0; }
    input { padding: 8px; width: 70%; }
    button { padding: 8px 14px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Mes tâches</h1>
  <small id="env"></small>
  <div><input id="title" placeholder="Nouvelle tâche"> <button onclick="add()">Ajouter</button></div>
  <ul id="list"></ul>
  <script>
    async function load() {
      const h = await (await fetch('/api/health')).json();
      document.getElementById('env').textContent = 'Environnement : ' + h.env;
      const tasks = await (await fetch('/api/tasks')).json();
      document.getElementById('list').innerHTML = tasks.map(t => `<li>${t.title}</li>`).join('');
    }
    async function add() {
      const el = document.getElementById('title');
      await fetch('/api/tasks', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: el.value }) });
      el.value = ''; load();
    }
    load();
  </script>
</body>
</html>

name: CI/CD

# dev -> val -> main (prod)
on:
  push:
    branches: [dev, val, main]
  pull_request:
    branches: [dev, val, main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/tp-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/tp-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: backend
      - run: npm test
        working-directory: backend

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)  echo "tag=dev"  >> $GITHUB_OUTPUT ;;
            val)  echo "tag=val"  >> $GITHUB_OUTPUT ;;
            main) echo "tag=prod" >> $GITHUB_OUTPUT ;;
          esac
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  # Déploiement K8s via runner self-hosted installé sur le poste qui héberge K8s
  deploy:
    needs: build-push
    if: github.event_name == 'push' && (github.ref_name == 'val' || github.ref_name == 'main')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        shell: powershell
        run: |
          $envName = if ($env:GITHUB_REF_NAME -eq "main") { "prod" } else { "val" }
          $user = "${{ secrets.DOCKERHUB_USERNAME }}"
          Get-ChildItem k8s -Recurse -Filter *.yaml | ForEach-Object {
            $c = [IO.File]::ReadAllText($_.FullName).Replace("DOCKERHUB_USER", $user)
            [IO.File]::WriteAllText($_.FullName, $c)
          }
          kubectl apply -k "k8s/overlays/$envName"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl -n $envName rollout restart deployment/backend deployment/frontend
          kubectl -n $envName rollout status deployment/backend --timeout=180s
          kubectl -n $envName rollout status deployment/frontend --timeout=180s